name: Import Era Theory release

on:
  push:
    paths:
      - .github/workflows/import-release.yml

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Check out destination repository
        uses: actions/checkout@v4

      - name: Fetch reviewed Era Theory release
        run: |
          git clone --depth 1 --branch agent/era-theory-multireport-v2 \
            https://github.com/tucknub/belt-theory.git /tmp/belt-theory

      - name: Copy release to repository root
        run: |
          rsync -a --delete \
            --exclude '.git/' \
            --exclude '.github/' \
            /tmp/belt-theory/prototypes/era-theory/ ./

      - name: Build and verify
        run: |
          npm run build
          npm run verify

      - name: Commit imported release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No release changes to commit."
            exit 0
          fi
          git commit -m "Import Era Theory multi-report release"
          git push
