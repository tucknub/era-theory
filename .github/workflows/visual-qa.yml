name: Visual QA — Era Theory Redesign

on:
  pull_request:
    paths:
      - 'src/**'
      - 'scripts/**'
      - 'package.json'
      - '.github/workflows/visual-qa.yml'

permissions:
  contents: read

jobs:
  screenshots:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build and verify
        run: |
          npm run build
          npm run verify

      - name: Install Chromium for screenshot QA
        run: npx --yes playwright@1.55.0 install --with-deps chromium

      - name: Start local preview
        run: |
          python3 -m http.server 4173 -d dist >/tmp/era-theory-server.log 2>&1 &
          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/era-theory-server.log
          exit 1

      - name: Capture desktop and mobile screenshots
        run: |
          mkdir -p screenshots
          npx --yes playwright@1.55.0 screenshot --browser=chromium --viewport-size="1536,1000" http://127.0.0.1:4173/ screenshots/home-desktop.png
          npx --yes playwright@1.55.0 screenshot --browser=chromium --viewport-size="1536,1000" http://127.0.0.1:4173/reports/colts/ screenshots/colts-desktop.png
          npx --yes playwright@1.55.0 screenshot --browser=chromium --viewport-size="1536,1000" http://127.0.0.1:4173/research/ screenshots/research-desktop.png
          npx --yes playwright@1.55.0 screenshot --browser=chromium --viewport-size="390,844" http://127.0.0.1:4173/ screenshots/home-mobile.png
          npx --yes playwright@1.55.0 screenshot --browser=chromium --viewport-size="390,844" http://127.0.0.1:4173/reports/colts/ screenshots/colts-mobile.png
          npx --yes playwright@1.55.0 screenshot --browser=chromium --viewport-size="390,844" http://127.0.0.1:4173/research/ screenshots/research-mobile.png

      - name: Upload visual QA screenshots and authentic source archive
        uses: actions/upload-artifact@v4
        with:
          name: era-theory-visual-qa
          path: |
            screenshots/*.png
            dist/assets/archive/*
          retention-days: 1
